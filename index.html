<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SEO head.

      Everything below is static because it is static: one page, one canonical
      URL, one description. The one thing that is *not* written here by hand is
      the JSON-LD — see the placeholder further down and src/content/jsonLd.ts.

      The origin appears in several places here and once more in
      src/content/site.ts and public/sitemap.xml. If the domain changes, change
      all three.

      Title is kept under ~60 characters so Google does not truncate it, and it
      leads with what people search for rather than with the brand name, which
      nobody is searching for yet.
    -->
    <title>طراحی سایت، اپلیکیشن و اتوماسیون در شیراز | بیزینکس</title>
    <meta
      name="description"
      content="ما یک تیم کوچک در شیرازیم و برای کسب‌وکارها وب‌سایت، اپلیکیشن و اتوماسیون می‌سازیم. پیش از شروع می‌نویسیم قرار است چه چیزی ساخته شود، در طول کار خبرتان می‌کنیم، و بعد از تحویل هم می‌مانیم."
    />
    <link rel="canonical" href="https://bizynex.ir/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!--
      One page, one language. hreflang is here anyway because it is the thing
      that tells Google this page is *deliberately* Persian rather than
      Persian-by-accident, which matters when the same query is served in three
      languages. x-default points at the same URL: there is nowhere else to go.
    -->
    <link rel="alternate" hreflang="fa-IR" href="https://bizynex.ir/" />
    <link rel="alternate" hreflang="x-default" href="https://bizynex.ir/" />

    <!-- Country and city, for the engines that still read these. Cheap, and the
         same facts are in the JSON-LD PostalAddress where they carry more. -->
    <meta name="geo.region" content="IR-07" />
    <meta name="geo.placename" content="Shiraz" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="بیزینکس" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:url" content="https://bizynex.ir/" />
    <meta property="og:title" content="طراحی سایت، اپلیکیشن و اتوماسیون در شیراز | بیزینکس" />
    <meta
      property="og:description"
      content="یک تیم کوچک در شیراز. وب‌سایت، اپلیکیشن و اتوماسیون می‌سازیم — و از اولین گفتگو تا سال‌ها بعد از تحویل، همان آدم‌هایی هستیم که جواب می‌دهیم."
    />
    <!-- Generated by `npm run build:og` from the same copy the page uses, so a
         wording change cannot leave a stale card behind. Dimensions are stated
         because several previewers lay the card out before the image has
         downloaded, and a card that reflows is a card that looks broken. -->
    <meta property="og:image" content="https://bizynex.ir/brand/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="بیزینکس — وب‌سایت، اپلیکیشن و اتوماسیون برای کسب‌وکارها، شیراز" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="طراحی سایت، اپلیکیشن و اتوماسیون در شیراز | بیزینکس" />
    <meta
      name="twitter:description"
      content="یک تیم کوچک در شیراز. وب‌سایت، اپلیکیشن و اتوماسیون می‌سازیم — و از اولین گفتگو تا سال‌ها بعد از تحویل، همان آدم‌هایی هستیم که جواب می‌دهیم."
    />
    <meta name="twitter:image" content="https://bizynex.ir/brand/og-cover.png" />
    <meta name="twitter:image:alt" content="بیزینکس — وب‌سایت، اپلیکیشن و اتوماسیون برای کسب‌وکارها، شیراز" />

    <meta name="theme-color" content="#FFFFFF" />

    <!--
      Four icons, because four different consumers ask for four different
      things and none of them falls back to the others:

        favicon.svg       every current browser, and it scales
        icon-96.png       Google's favicon crawler, which wants a raster ≥48px
        apple-touch-icon  iOS home screen, opaque, exactly 180×180
        site.webmanifest  Android's install prompt, and the name it uses

      All of them come out of `npm run build:og`.
    -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/icon-96.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Runs before the stylesheet is applied, so the page never paints in the
      wrong theme and then corrects itself. It is inline for the same reason:
      a separate request could not possibly arrive in time, and CLAUDE.md 2
      rules out fetching it from anywhere else anyway.

      The storage key is shared with src/hooks/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bizynex:theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0A1A28');
          }
        } catch (error) {
          /* Storage blocked. The CSS media query still gives the right theme. */
        }
      })();
    </script>

    <!--
      Decides, before anything paints, whether this visit opens with the intro.

      Without this the prerendered page paints first and the opening drops on top
      of it a moment later, which reads as a mistake. The cover below is plain
      static HTML, so the very first frame the browser produces is already the
      dark room. React does not get a say until it has hydrated.

      Deliberately only the two cheap checks. If this covers the page and the
      real gate in src/hooks/useIntroGate.ts then decides against an opening —
      no WebGL, too little memory — React pulls the cover straight back off.
      Guessing wrong that way costs a frame. Guessing wrong the other way is the
      flash this exists to prevent.
    -->
    <script>
      (function () {
        var root = document.documentElement;

        /*
          Nobody who is not a person gets the opening.

          A crawler is not being rude when it reads the page — it is doing the
          thing the whole site exists for. But it renders once, it does not
          wait, and it does not scroll, so an opening it has to sit through is
          an opening that is simply in the way. Googlebot would still index the
          copy, because the copy is in the DOM behind the cover the whole time,
          but the frame it screenshots for its own layout checks would be a
          dark rectangle, and every field metric it collects would be measured
          against a panel rather than against the page.

          `navigator.webdriver` catches headless Chrome, which is what both
          Googlebot and Lighthouse are. The string check catches the rest.
          Both are hints rather than proof, and that is the right trade here:
          the cost of a false positive is one visitor missing an animation.
        */
        var ua = navigator.userAgent || '';
        var isNotAPerson =
          navigator.webdriver === true ||
          /bot|crawl|spider|slurp|headless|lighthouse|pagespeed|preview|facebookexternalhit|telegrambot|whatsapp|embedly/i.test(
            ua,
          );

        var seen = false;
        try {
          seen = sessionStorage.getItem('bizynex:intro-shown') === '1';
        } catch (error) {
          /* Storage blocked. Treat it as a first visit and show the opening. */
        }

        if (isNotAPerson || seen || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        root.dataset.intro = 'pending';

        /*
          The cover comes off by itself if nothing else takes it off.

          Everything that normally lifts it — the overture, the curtain, the
          gate deciding against both — lives in the JavaScript bundle. So the
          one failure this cannot survive is the bundle not arriving: a chunk
          that times out on a throttled connection leaves a visitor staring at
          a navy rectangle with the entire page sitting readable underneath it.
          CLAUDE.md section 2 tells us to assume exactly that connection.

          Eight seconds is past any opening that is going well and well short
          of the twelve-ish seconds at which people leave. It is cleared on the
          way out of a normal opening, so this only ever fires when something
          has genuinely gone wrong.
        */
        window.__bizynexCoverTimeout = setTimeout(function () {
          delete root.dataset.intro;
        }, 8000);
      })();
    </script>

    <!--
      Critical styles, inline for the same reason as the scripts above: the
      stylesheet is a separate file, and in development Vite injects it with
      JavaScript, so neither is reliably in effect on the first paint.

      These are the only hard-coded colours in the project. src/styles/tokens.css
      remains the source of truth — navy-900 and navy-700 are copied here because
      a custom property defined in that stylesheet cannot be read before it
      loads. If those two tokens change, change them here too.
    -->
    <style>
      #intro-cover {
        display: none;
      }
      html[data-intro] #intro-cover {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 40;
        align-items: center;
        justify-content: center;
        background-color: #0a1a28;
        color: #1d3e58;
        font-family: Vazirmatn, system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(2rem, 1rem + 5vw, 4.5rem);
        letter-spacing: 0.16em;
        transition: opacity 500ms ease-out;
      }
      /* The opening is on its way out and the page behind is worth seeing. */
      html[data-intro='lifting'] #intro-cover {
        opacity: 0;
      }
      /* Nothing behind the cover is reachable, so nothing behind it should
         scroll. The gutter is reserved site-wide in tokens.css so that letting
         go of the scrollbar again does not shift the page sideways. */
      html[data-intro] body {
        overflow: hidden;
      }
    </style>

    <!--
      Replaced at build time by scripts/prerender.mjs with structured data
      generated from src/content/fa.ts. Left as a comment in the source so that
      the FAQ answers Google reads and the FAQ answers a visitor reads are
      literally the same strings and cannot drift apart.

      `npm run dev` leaves it as a comment. That is fine — nothing crawls dev.
    -->
    <!--seo-jsonld-->

    <!-- Only the body weight is preloaded. SemiBold is used for headings and
         can arrive a beat later without shifting the reading experience. -->
    <link
      rel="preload"
      href="/fonts/vazirmatn-regular-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Sits outside #root so the prerender step, which only replaces the root
         element's contents, leaves it alone. Decorative: the same word is in the
         page proper, and the scene draws it again a moment later. -->
    <div id="intro-cover" aria-hidden="true" dir="ltr" lang="en">BIZYNEX</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
