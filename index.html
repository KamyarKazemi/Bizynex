<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SEO head.

      Everything below is static because it is static: one page, one canonical
      URL, one description. The one thing that is *not* written here by hand is
      the JSON-LD — see the placeholder further down and src/content/jsonLd.ts.

      The origin appears in several places here and once more in
      src/content/site.ts and public/robots.txt. If the domain changes, change
      all three.

      Title is kept under ~60 characters so Google does not truncate it, and it
      leads with what people search for rather than with the brand name, which
      nobody is searching for yet.
    -->
    <meta
      name="google-site-verification"
      content="njRfdBybJRPL-SsBar7Th82-m51UcKhiskVZHEse7zU"
    />

    <title>طراحی سایت، اپلیکیشن و اتوماسیون در شیراز | بیزینکس</title>
    <meta
      name="description"
      content="یک تیم کوچک در شیراز. برای کسب‌وکارها وب‌سایت، اپلیکیشن و اتوماسیون می‌سازیم؛ محدوده را پیش از شروع می‌نویسیم و بعد از تحویل هم می‌مانیم."
    />
    <link rel="canonical" href="https://bizynex.vercel.app/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />

    <!--
      One page, one language. hreflang is here anyway because it is the thing
      that tells Google this page is *deliberately* Persian rather than
      Persian-by-accident, which matters when the same query is served in three
      languages. x-default points at the same URL: there is nowhere else to go.
    -->
    <link rel="alternate" hreflang="fa-IR" href="https://bizynex.vercel.app/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://bizynex.vercel.app/"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="بیزینکس" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:url" content="https://bizynex.vercel.app/" />
    <meta
      property="og:title"
      content="طراحی سایت، اپلیکیشن و اتوماسیون در شیراز | بیزینکس"
    />
    <meta
      property="og:description"
      content="یک تیم کوچک در شیراز. وب‌سایت، اپلیکیشن و اتوماسیون می‌سازیم — و از اولین گفتگو تا سال‌ها بعد از تحویل، همان آدم‌هایی هستیم که جواب می‌دهیم."
    />
    <!-- Generated by `npm run build:og` from the same copy the page uses, so a
         wording change cannot leave a stale card behind. Dimensions are stated
         because several previewers lay the card out before the image has
         downloaded, and a card that reflows is a card that looks broken. -->
    <meta
      property="og:image"
      content="https://bizynex.vercel.app/brand/og-cover.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="بیزینکس — وب‌سایت، اپلیکیشن و اتوماسیون برای کسب‌وکارها، شیراز"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="طراحی سایت، اپلیکیشن و اتوماسیون در شیراز | بیزینکس"
    />
    <meta
      name="twitter:description"
      content="یک تیم کوچک در شیراز. وب‌سایت، اپلیکیشن و اتوماسیون می‌سازیم — و از اولین گفتگو تا سال‌ها بعد از تحویل، همان آدم‌هایی هستیم که جواب می‌دهیم."
    />
    <meta
      name="twitter:image"
      content="https://bizynex.vercel.app/brand/og-cover.png"
    />
    <meta
      name="twitter:image:alt"
      content="بیزینکس — وب‌سایت، اپلیکیشن و اتوماسیون برای کسب‌وکارها، شیراز"
    />

    <!--
      Both values are declared statically, so a device in dark mode gets the dark
      colour on the very first paint — before the script below has run — and so
      does anything that reads this HTML without executing it. The two hexes are
      --color-paper and --color-navy-900 from src/styles/tokens.css.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#FFFFFF"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0A1A28"
    />

    <!--
      Icons, because several consumers ask for different things and none of
      them falls back to the others:

        favicon-32/48     the browser tab, at both display densities
        icon-96.png       Google's favicon crawler, which wants a raster ≥48px
        apple-touch-icon  iOS home screen, opaque, exactly 180×180
        site.webmanifest  Android's install prompt, and the name it uses

      All of them come out of `npm run build:og`, and all of them are the mark
      alone — the stacked lockup's wordmark is unreadable below about 128px.

      Raster rather than SVG: the only masters in this repo are PNG, and a
      hand-traced vector of a woven mark is a redrawn mark, which CONTEXT.md
      section 3 forbids. If the original vector artwork turns up, an svg+xml
      icon link placed in front of these two is a strictly better first choice —
      browsers take the first format they understand — and it would also let the
      mark answer to prefers-color-scheme, which a PNG cannot.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/brand/favicon-48.png"
    />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/icon-96.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Runs before the stylesheet is applied, so the page never paints in the
      wrong theme and then corrects itself. It is inline for the same reason:
      a separate request could not possibly arrive in time, and CLAUDE.md 2
      rules out fetching it from anywhere else anyway.

      The storage key is shared with src/hooks/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bizynex:theme");
          var dark = stored
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (stored) {
            /*
              A stored choice is a deliberate one, so it has to beat the two
              media-scoped tags above — which otherwise still answer to the OS.
              Dropping `media` from both leaves the last one winning, so both
              get the resolved colour and it no longer matters which that is.
              Untouched when there is no stored choice: the tags are already
              right, and the browser has already used them.
            */
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) {
              metas[i].removeAttribute("media");
              metas[i].setAttribute("content", dark ? "#0A1A28" : "#FFFFFF");
            }
          }
        } catch (error) {
          /* Storage blocked. The CSS media query still gives the right theme. */
        }
      })();
    </script>

    <!--
      Decides, before anything paints, whether this visit opens with the intro.

      Without this the prerendered page paints first and the opening drops on top
      of it a moment later, which reads as a mistake. The cover below is plain
      static HTML, so the very first frame the browser produces is already the
      dark room. React does not get a say until it has hydrated.

      Deliberately only the two cheap checks. If this covers the page and the
      real gate in src/hooks/useIntroGate.ts then decides against an opening —
      no WebGL, too little memory — React pulls the cover straight back off.
      Guessing wrong that way costs a frame. Guessing wrong the other way is the
      flash this exists to prevent.
    -->
    <script>
      (function () {
        var root = document.documentElement;

        /*
          Nobody who is not a person gets the opening.

          A crawler is not being rude when it reads the page — it is doing the
          thing the whole site exists for. But it renders once, it does not
          wait, and it does not scroll, so an opening it has to sit through is
          an opening that is simply in the way. Googlebot would still index the
          copy, because the copy is in the DOM behind the cover the whole time,
          but the frame it screenshots for its own layout checks would be a
          dark rectangle, and every field metric it collects would be measured
          against a panel rather than against the page.

          `navigator.webdriver` catches headless Chrome, which is what both
          Googlebot and Lighthouse are. The string check catches the rest.
          Both are hints rather than proof, and that is the right trade here:
          the cost of a false positive is one visitor missing an animation.
        */
        /*
          Refuse the page transition only when the page is about to cover
          itself anyway.

          `pagereveal` fires in the *incoming* document before its first
          render, which is the only moment anything knows both that a
          transition is running and what this page is about to look like.
          Registered before every early return below, because it applies on
          every page and not only on the ones that put a cover up: reaching
          home from a service page without having seen the opening lands here,
          and sliding a card into the front of the room is two entrances
          fighting. Skipping leaves an ordinary navigation, which is what an
          opening already is.
        */
        window.addEventListener("pagereveal", function (event) {
          if (event.viewTransition && root.dataset.intro)
            event.viewTransition.skipTransition();
        });

        var ua = navigator.userAgent || "";
        var isNotAPerson =
          navigator.webdriver === true ||
          /bot|crawl|spider|slurp|headless|lighthouse|pagespeed|preview|facebookexternalhit|telegrambot|whatsapp|embedly/i.test(
            ua,
          );

        var seen = false;
        try {
          seen = sessionStorage.getItem("bizynex:intro-shown") === "1";
        } catch (error) {
          /* Storage blocked. Treat it as a first visit and show the opening. */
        }

        if (
          isNotAPerson ||
          seen ||
          matchMedia("(prefers-reduced-motion: reduce)").matches
        )
          return;

        /*
          Only the home page opens with anything.

          This cover exists so an opening does not drop on top of a page that
          has already painted — and the opening only ever runs on `/`. On a
          service page React calls removeCover() the moment it mounts, so the
          panel was pure cost there: a navy frame in front of the page for
          exactly the visitor the service pages are written for, the one
          arriving from a search result.

          It matters more now that pages transition into one another. A page
          whose first painted frame is an opaque rectangle is the frame the
          browser hands to the transition, so without this the reward for
          following a link would be a cross-fade into navy.
        */
        if (location.pathname !== "/" && location.pathname !== "/index.html")
          return;

        root.dataset.intro = "pending";

        /*
          The cover comes off by itself if nothing else takes it off.

          Everything that normally lifts it — the overture, the curtain, the
          gate deciding against both — lives in the JavaScript bundle. So the
          one failure this cannot survive is the bundle not arriving: a chunk
          that times out on a throttled connection leaves a visitor staring at
          a navy rectangle with the entire page sitting readable underneath it.
          CLAUDE.md section 2 tells us to assume exactly that connection.

          Eight seconds is past any opening that is going well and well short
          of the twelve-ish seconds at which people leave. It is cleared on the
          way out of a normal opening, so this only ever fires when something
          has genuinely gone wrong.
        */
        window.__bizynexCoverTimeout = setTimeout(function () {
          delete root.dataset.intro;
        }, 8000);
      })();
    </script>

    <!--
      Critical styles, inline for the same reason as the scripts above: the
      stylesheet is a separate file, and in development Vite injects it with
      JavaScript, so neither is reliably in effect on the first paint.

      These are the only hard-coded colours in the project. src/styles/tokens.css
      remains the source of truth — navy-900 and navy-700 are copied here because
      a custom property defined in that stylesheet cannot be read before it
      loads. If those two tokens change, change them here too.
    -->
    <style>
      /*
        The page-to-page transition opt-in, and it has to be *here* rather than
        in index.css.

        A view transition is only built if both documents have opted in before
        the incoming one paints its first frame. In `npm run dev` the stylesheet
        is injected by JavaScript, which is always later than that — so with the
        rule in index.css the transition simply never ran in development, and
        the first thing anyone checking the work would see is nothing at all.
        The same reasoning as the cover styles below, and the same fix.

        Only the opt-in is here. What the transition looks like is the
        `::view-transition-*` block in src/index.css, which is a linked,
        render-blocking stylesheet in the built pages and therefore always in
        effect in time. If it is ever late — dev, a cold cache — the browser
        falls back to its own cross-fade, which is a weaker version of this
        rather than a broken one.

        `types: home` is correct as authored, because this file *is* the home
        page's head. scripts/prerender.mjs rewrites it to `service` for the
        four service pages, the same way it rewrites the canonical and the
        title, and throws if it cannot find it. The incoming document's types
        are the ones in force during a cross-document transition, so this is
        how a navigation says whether it went deeper into the site or came
        back out — see `:active-view-transition-type()` in src/index.css.
      */
      @view-transition {
        navigation: auto;
        types: home;
      }

      /*
        The page's own background, before any stylesheet exists.

        This is what stops a navigation flashing white. A browser paints its
        default canvas — white — until something tells it otherwise, and the
        first frame of an incoming document is exactly the frame a view
        transition captures and then animates for 440ms. Without this rule a
        link followed in `npm run dev` produced one entirely blank white frame
        and then the page, which reads as the browser reloading rather than as
        a page arriving. It was visible on a screen recording as a single frame
        at 221 luminance against a page sitting at 20.

        In a built page the real stylesheet is render-blocking and would have
        set this anyway; here it is a frame earlier, which is the frame that
        was wrong. It costs two declarations and it removes a class of flash
        rather than one instance of it — the same reasoning that put the two
        `theme-color` metas above at the top of this file.

        Keyed to `data-theme` because the script further up has already set it
        from storage, synchronously, before this style is even parsed. The
        media query is the no-JavaScript path, where nothing sets the
        attribute at all.
      */
      html {
        background-color: #ffffff;
      }
      html[data-theme="dark"] {
        background-color: #0a1a28;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background-color: #0a1a28;
        }
      }

      #intro-cover {
        display: none;
      }
      html[data-intro] #intro-cover {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 40;
        align-items: center;
        justify-content: center;
        background-color: #0a1a28;
        /* 1.58:1, deliberately. This is the ghost wordmark, not readable text:
           the element is aria-hidden="true" and the same word appears in the
           page proper, so raising it would only turn a quiet cover into a
           splash screen. Leave it. (Matches --color-opening-faint.) */
        color: #1d3e58;
        font-family: Vazirmatn, system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(2rem, 1rem + 5vw, 4.5rem);
        letter-spacing: 0.16em;
        transition: opacity 500ms ease-out;
      }
      /* The opening is on its way out and the page behind is worth seeing. */
      html[data-intro="lifting"] #intro-cover {
        opacity: 0;
      }
      /* Nothing behind the cover is reachable, so nothing behind it should
         scroll. The gutter is reserved site-wide in tokens.css so that letting
         go of the scrollbar again does not shift the page sideways. */
      html[data-intro] body {
        overflow: hidden;
      }
    </style>

    <!--
      Replaced at build time by scripts/prerender.mjs with structured data
      generated from src/content/fa.ts. Left as a comment in the source so that
      the FAQ answers Google reads and the FAQ answers a visitor reads are
      literally the same strings and cannot drift apart.

      `npm run dev` leaves it as a comment. That is fine — nothing crawls dev.
    -->
    <!--seo-jsonld-->

    <!--
      Fetch the next page while the pointer is still travelling to the link.

      A cross-document view transition holds the *old* page on screen, frozen,
      until the new document is ready to render. That wait is the whole of the
      delay between pressing a link and the card starting to move — the
      animation itself has not begun yet. On a prerendered page from a static
      host the wait is around 10ms and invisible; on a slow Iranian connection,
      which CLAUDE.md section 2 says to assume, it is not.

      `moderate` is hover and pointer-down, not viewport visibility: nothing is
      fetched until the visitor has shown intent, which is the only version of
      this that is honest about someone else's bandwidth. Four pages of 11KB
      are not a burden; four pages fetched because they happened to scroll past
      would be.

      `prefetch` and deliberately **not** `prerender`. Prerender would execute
      the page — its scripts, its capability detection, and @vercel/analytics —
      in the background, which would report page views for pages nobody
      visited. A fetched document is inert until it is navigated to.
    -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "source": "document",
            "where": { "href_matches": "/*" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>

    <!-- Only the body weight is preloaded. SemiBold is used for headings and
         can arrive a beat later without shifting the reading experience. -->
    <link
      rel="preload"
      href="/fonts/vazirmatn-regular-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Sits outside #root so the prerender step, which only replaces the root
         element's contents, leaves it alone. Decorative: the same word is in the
         page proper, and the scene draws it again a moment later. -->
    <div id="intro-cover" aria-hidden="true" dir="ltr" lang="en">BIZYNEX</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
